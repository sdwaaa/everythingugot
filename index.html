  .hero .veil { position:absolute; inset:0; background:linear-gradient(180deg,rgba(4,10,30,.15) 0%,rgba(5,12,34,.35) 55%,rgba(4,8,22,.92) 100%); }
  .hero .cap { position:absolute; left:0; right:0; bottom:12px; text-align:center; font-size:12.5px; color:#bcd4ff; text-shadow:0 1px 10px rgba(0,0,0,.6); }
  .langbar { display:flex; gap:8px; justify-content:center; margin:0 0 14px; }
  .langbar button { border:1px solid var(--glass-border); background:var(--glass); color:var(--hint); border-radius:20px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .langbar button.active { background:linear-gradient(120deg,var(--neon2),var(--neon)); color:#fff; border-color:transparent; box-shadow:var(--glow); }
  .tabs { display:flex; gap:8px; margin:0 0 16px; overflow-x:auto; padding-bottom:2px; }
  .tab { flex:none; padding:9px 15px; border-radius:22px; font-size:13px; font-weight:600; background:var(--glass); color:var(--hint); border:1px solid var(--glass-border); cursor:pointer; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .tab.active { color:#fff; border-color:transparent; background:linear-gradient(120deg,var(--neon2),var(--neon),var(--neon2)); background-size:200% 100%; animation:shimmer 4s linear infinite; box-shadow:var(--glow); }
  .panel { display:none; } .panel.active { display:block; animation:fade .25s ease; }
  @keyframes fade {from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .section-title { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--hint); margin:18px 6px 10px; }
  .card { background:var(--glass); border:1px solid var(--glass-border); border-radius:16px; padding:14px 16px; margin-bottom:10px; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:0 6px 20px rgba(0,30,90,.25); }
  .feat { display:flex; align-items:flex-start; gap:12px; }
  .feat .ic { font-size:20px; width:26px; text-align:center; flex:none; filter:drop-shadow(0 0 6px rgba(54,182,255,.5)); }
  .feat .body h3 { margin:0 0 2px; font-size:15px; font-weight:600; } .feat .body p { margin:0; font-size:13px; color:var(--hint); line-height:1.35; }
  .tariff { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .tariff .meta h3 { margin:0 0 2px; font-size:15px; font-weight:600; } .tariff .meta p { margin:0; font-size:12px; color:var(--hint); }
  .buy { color:#fff; border:none; cursor:pointer; white-space:nowrap; min-width:92px; padding:11px 16px; border-radius:12px; font-size:14px; font-weight:700; background:linear-gradient(120deg,#1e6bff,#36d1ff,#1e6bff); background-size:200% 100%; animation:shimmer 5s linear infinite; box-shadow:0 4px 16px rgba(30,120,255,.5); }
  .buy.best { background:linear-gradient(120deg,#6a3cff,#36b6ff,#6a3cff); background-size:200% 100%; }

  var LANG = "ru";
  function pickLang() {
    var saved = null; try { saved = localStorage.getItem('eug_lang'); } catch(e){}
    if (saved && I18N[saved]) return saved;
    var tl = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "";
    tl = tl.slice(0,2);
    if (tl === 'uk') return 'uk'; if (tl === 'pl') return 'pl'; if (tl === 'en') return 'en';
    return 'ru';
  }
  function T(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.ru[k] || k; }

    document.documentElement.lang = LANG;
  }
  document.querySelectorAll('.langbar button').forEach(function(b){ b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); }); });

  var inv=document.getElementById('btn-invite');
  if(inv) inv.addEventListener('click', function(){
    var uid=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)?tg.initDataUnsafe.user.id:null;
    var link=uid?('https://t.me/'+BOT+'?start=ref_'+uid):('https://t.me/'+BOT);
    openModal('<h2>'+T('invite_h')+'</h2><p>'+T('invite_p')+'</p><div class="linkbox">'+link+'</div><div class="act"><button id="copybtn">'+T('copy')+'</button><button id="sharebtn">'+T('share')+'</button></div>');
    document.getElementById('copybtn').addEventListener('click', function(){ var s=this; try{ navigator.clipboard.writeText(link).then(function(){ s.textContent=T('copied'); }); }catch(e){ if(tg&&tg.showAlert) tg.showAlert(link); } });
    document.getElementById('sharebtn').addEventListener('click', function(){ var sh='https://t.me/share/url?url='+encodeURIComponent(link); if(tg&&tg.openTelegramLink) tg.openTelegramLink(sh); else window.open(sh,'_blank'); });
  });

  function showStatus(){ openModal('<h2>'+T('status_h')+'</h2><p>'+T('status_load')+'</p>');
    fetch(API_BASE+'/api/status?initData='+encodeURIComponent(INITDATA)).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok){ mbody.innerHTML='<h2>'+T('status_h')+'</h2><p>'+T('status_err')+'</p>'; return; }
      var body = d.owner ? T('status_owner') : (T('status_until')+' <b>'+d.date+'</b><br>'+T('status_days')+' <b>'+d.days+'</b>');
      mbody.innerHTML='<h2>'+T('status_h')+'</h2><p>'+body+'</p>';
    }).catch(function(){ mbody.innerHTML='<h2>'+T('status_h')+'</h2><p>'+T('status_err')+'</p>'; });
  }
  function promoModal(){ openModal('<h2>'+T('promo_h')+'</h2><input id="promoin" class="inp" placeholder="'+T('promo_in')+'"><div class="act"><button id="promook">'+T('promo_apply')+'</button></div><p id="promores"></p>');
    document.getElementById('promook').addEventListener('click', function(){ var code=document.getElementById('promoin').value.trim(); if(!code) return;
      fetch(API_BASE+'/api/promo/check?initData='+encodeURIComponent(INITDATA)+'&code='+encodeURIComponent(code)).then(function(r){return r.json();}).then(function(d){
        if(d&&d.ok){ PROMO=code; document.getElementById('promores').innerHTML=T('promo_ok')+' '+d.discount+T('promo_pick'); } else document.getElementById('promores').innerHTML=T('promo_bad');
      }).catch(function(){ document.getElementById('promores').innerHTML=T('status_err'); }); });
  }
  function giftModal(){ openModal('<h2>'+T('gift_h')+'</h2><p>'+T('gift_p')+'</p><input id="giftin" class="inp" inputmode="numeric" placeholder="123456789"><div class="act"><button id="giftok">'+T('gift_save')+'</button></div><p id="giftres"></p>');
    document.getElementById('giftok').addEventListener('click', function(){ var v=document.getElementById('giftin').value.trim(); if(/^-?\d+$/.test(v)){ GIFT=v; document.getElementById('giftres').innerHTML=T('gift_ok'); setTimeout(closeModal,1500); } else document.getElementById('giftres').innerHTML=T('gift_bad'); });
  }

  document.querySelectorAll('[data-link]').forEach(function(b){ b.addEventListener('click', function(){ var k=b.getAttribute('data-link'); if(api){ if(k==='status') return showStatus(); if(k==='promo') return promoModal(); if(k==='gift') return giftModal(); } openBot(k); }); });
  function openBot(p){ var u='https://t.me/'+BOT+'?start='+p; if(tg&&tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u,'_blank'); }

  LANG = pickLang(); setLang(LANG);
</script>
</body>
</html>
