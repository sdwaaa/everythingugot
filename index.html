<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>EverythingUGot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --text:#efeaff; --hint:#b3a6d9; --glass:rgba(32,22,64,.55); --glass-border:rgba(150,120,255,.22); --neon:#a07bff; --neon2:#6d3cff; --glow:0 0 18px rgba(124,77,255,.45); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { margin:0 auto; padding:0 16px calc(80px + env(safe-area-inset-bottom)); max-width:680px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); background:linear-gradient(135deg,#07050f,#140a33,#0c0624,#1e0f4d,#08051a); background-size:400% 400%; animation:bgshift 18s ease infinite; min-height:100vh; }
  @keyframes bgshift {0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes shimmer {0%{background-position:0% 50%}100%{background-position:200% 50%}}
  .hero { margin:0 -16px 16px; padding:30px 16px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; border-radius:0 0 28px 28px; background:radial-gradient(120% 90% at 50% -10%, rgba(124,77,255,.32), rgba(10,8,24,0) 62%), linear-gradient(180deg,#0e0a24,#08060f); box-shadow:0 10px 40px rgba(70,30,160,.3); }
  .hero .logo { width:88px; height:88px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 1px rgba(150,120,255,.4), 0 10px 30px rgba(109,60,255,.5); }
  .hero .wm { font-size:27px; font-weight:800; letter-spacing:-.01em; line-height:1; }
  .hero .wm span { background:linear-gradient(120deg,#b79bff,#7c4dff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .hero .cap { text-align:center; font-size:13px; color:var(--hint); max-width:300px; line-height:1.35; }
  .langbar { display:flex; gap:8px; justify-content:center; margin:0 0 14px; }
  .langbar button { border:1px solid var(--glass-border); background:var(--glass); color:var(--hint); border-radius:20px; min-height:36px; padding:6px 14px; font-size:13px; cursor:pointer; }
  .langbar button.active { background:linear-gradient(120deg,var(--neon2),var(--neon)); color:#fff; border-color:transparent; box-shadow:var(--glow); }
  .tabs { display:flex; gap:8px; margin:0 0 16px; overflow-x:auto; padding-bottom:2px; }
  .tab { flex:none; display:flex; align-items:center; min-height:44px; padding:0 16px; border-radius:22px; font-size:13px; font-weight:600; background:var(--glass); color:var(--hint); border:1px solid var(--glass-border); cursor:pointer; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .tab.active { color:#fff; border-color:transparent; background:linear-gradient(120deg,var(--neon2),var(--neon),var(--neon2)); background-size:200% 100%; animation:shimmer 4s linear infinite; box-shadow:var(--glow); }
  .panel { display:none; } .panel.active { display:block; animation:fade .25s ease; }
  @keyframes fade {from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .section-title { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--hint); margin:18px 6px 10px; }
  .card { background:var(--glass); border:1px solid var(--glass-border); border-radius:16px; padding:14px 16px; margin-bottom:10px; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:0 6px 20px rgba(0,30,90,.25); }
  .feat { display:flex; align-items:flex-start; gap:12px; }
  .feat .ic { font-size:20px; width:26px; text-align:center; flex:none; filter:drop-shadow(0 0 6px rgba(124,77,255,.5)); }
  .feat .body h3 { margin:0 0 2px; font-size:15px; font-weight:600; } .feat .body p { margin:0; font-size:13px; color:var(--hint); line-height:1.35; }
  .tariff { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .tariff .meta h3 { margin:0 0 2px; font-size:15px; font-weight:600; } .tariff .meta p { margin:0; font-size:12px; color:var(--hint); }
  .buy { color:#fff; border:none; cursor:pointer; white-space:nowrap; min-width:92px; padding:11px 16px; border-radius:12px; font-size:14px; font-weight:700; background:linear-gradient(120deg,#6d3cff,#a07bff,#6d3cff); background-size:200% 100%; animation:shimmer 5s linear infinite; box-shadow:0 4px 16px rgba(109,60,255,.5); }
  .buy.best { background:linear-gradient(120deg,#6a3cff,#a07bff,#6a3cff); background-size:200% 100%; }
  .buy:active { transform:scale(.97); }
  .wide { display:flex; align-items:center; gap:11px; width:100%; background:var(--glass); color:var(--text); border:1px solid var(--glass-border); padding:15px 16px; border-radius:14px; font-size:15px; font-weight:600; cursor:pointer; margin-bottom:10px; text-align:left; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .wide .ic { font-size:18px; filter:drop-shadow(0 0 6px rgba(124,77,255,.5)); }
  .wide:active { transform:scale(.99); box-shadow:var(--glow); border-color:var(--neon); }
  .badge { display:inline-block; font-size:11px; color:#fff; padding:2px 8px; border-radius:20px; margin-left:6px; vertical-align:middle; background:linear-gradient(120deg,#6a3cff,#a07bff); box-shadow:0 0 10px rgba(80,120,255,.5); }
  .note { font-size:12px; color:var(--hint); text-align:center; margin:16px 6px 0; line-height:1.45; }
  .big-emoji { text-align:center; font-size:34px; margin:6px 0; filter:drop-shadow(0 0 12px rgba(124,77,255,.6)); }
  .modal-ov { position:fixed; inset:0; background:rgba(3,8,20,.72); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); display:none; align-items:flex-end; z-index:50; }
  .modal-ov.open { display:flex; }
  .sheet { width:100%; max-width:680px; margin:0 auto; max-height:86vh; overflow-y:auto; background:linear-gradient(180deg,#0a1836,#060f24); border:1px solid var(--glass-border); border-radius:20px 20px 0 0; padding:16px 18px 28px; box-shadow:0 -10px 40px rgba(0,40,120,.5); animation:up .25s ease; }
  @keyframes up {from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet .close { position:sticky; top:0; float:right; background:var(--glass); border:1px solid var(--glass-border); color:#fff; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:16px; }
  .sheet h2 { margin:2px 0 10px; font-size:19px; background:linear-gradient(120deg,#a07bff,#8f6bff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .sheet h3 { margin:16px 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--neon); }
  .sheet p,.sheet li { font-size:13.5px; color:var(--hint); line-height:1.5; margin:6px 0; }
  .sheet p b { color:#dbe8ff; }
  .sheet code { background:rgba(124,77,255,.12); padding:1px 6px; border-radius:6px; color:#9fd0ff; font-size:12.5px; }
  .sheet .row { display:flex; gap:10px; align-items:flex-start; margin:7px 0; } .sheet .row .e { font-size:17px; flex:none; }
  .linkbox { background:var(--glass); border:1px solid var(--glass-border); border-radius:12px; padding:12px; font-size:13px; color:#cfe0ff; word-break:break-all; margin:12px 0; }
  .act { display:flex; gap:10px; margin-top:8px; } .act button { flex:1; border:none; border-radius:12px; padding:12px; font-size:14px; font-weight:700; color:#fff; cursor:pointer; background:linear-gradient(120deg,#6d3cff,#a07bff); box-shadow:0 4px 14px rgba(109,60,255,.4); }
  .inp { width:100%; padding:12px; border-radius:12px; border:1px solid var(--glass-border); background:rgba(5,12,30,.6); color:#eaf2ff; font-size:15px; margin:8px 0; outline:none; }
  .inp:focus { border-color:var(--neon); box-shadow:var(--glow); }
  .cl { display:block; font-size:13px; color:#9fb0cf; margin:6px 2px 0; }
</style>
</head>

        '<h3>Експорт і пошук</h3>'+

        '<div class="row"><span class="e">⭐</span><p><b>За передплатою</b> — архівація: перехоплення видалених, змінених і одноразових фото, гілки контактів, пошук, експорт, зведення. Перші 3 дні безкоштовно.</p></div>',
      agr_html:'<p>Починаючи та продовжуючи користуватися ботом, ви приймаєте умови.</p>'+
        '<h3>1. Призначення</h3><p>Особистий архів ваших бізнес-чатів: збереження повідомлень, доступних медіа та метаданих, сповіщення про зміни й видалення. Потрібні Telegram Premium і під\'єднання бота.</p>'+
        '<h3>2. Дані</h3><p>Бот зберігає вміст і метадані ваших чатів, щоб показувати їх вам. Ви можете запросити видалення даних в адміністратора.</p>'+
        '<h3>3. Ваша відповідальність</h3><p>Ви використовуєте бота лише із законною метою й зобов\'язані дотримуватися законів про таємницю зв\'язку та захист персональних даних. Ви підтверджуєте право архівувати свої листування й несете повну відповідальність.</p>'+
        '<h3>4. Обмеження</h3><p>Сервіс «як є», без гарантій; частина функцій залежить від обмежень Telegram.</p>'+
        '<h3>5. Оплата</h3><p>Передплата оплачується через Telegram Stars (⭐).</p>'+
        '<h3>6. Зміни</h3><p>Умови можуть оновлюватися; продовження користування = згода. Не згодні — припиніть користування.</p>'+
        '<h3>7. Завантаження</h3><p>Інструменти завантаження (відео, музика, трек цілком) беруть контент зі сторонніх джерел. Відповідальність за завантаження та використання такого контенту, включно з авторськими правами, повністю несе користувач.</p>' },

      caps_html:'<h3>Automatycznie (czaty biznesowe)</h3>'+
        '<div class="row"><span class="e">🗑</span><p><b>Usunięte</b> — prześlę to, co rozmówca skasował.</p></div>'+

        '<div class="row"><span class="e">🖼</span><p><b>Zdjęcia jednorazowe</b> — łapię jednorazowe (odpowiedz na wiadomość).</p></div>'+
        '<h3>W czacie z rozmówcą</h3>'+

        '<div class="row"><span class="e">🔁</span><p><code>/spam tekst N</code> — wyśle do 30 razy.</p></div>'+

        '<h3>W grupach (bot-admin)</h3>'+

        '<h3>Narzędzia (bez Premium, w czacie z botem)</h3>'+

        '<div class="row"><span class="e">🌐</span><p><code>/tr en tekst</code> — tłumaczenie na dowolny język.</p></div>'+
        '<div class="row"><span class="e">🔳</span><p><code>/qr tekst</code> — kod QR. <code>/pass 16</code> — silne hasło.</p></div>'+

        '<div class="row"><span class="e">📥</span><p><code>/dl link</code> — wideo (TikTok/Instagram) do 1 GB.</p></div>'+
        '<div class="row"><span class="e">🎞</span><p><code>/gif</code> · <code>/circle</code> — odpowiedz na wideo. <code>/track</code> — jaki utwór. <code>/text</code> — głosówka na tekst.</p></div>'+
        '<h3>Eksport i wyszukiwanie</h3>'+
        '<div class="row"><span class="e">📤</span><p><code>/eksport</code> (w czacie z rozmówcą) — plik HTML z całą rozmową: 🔴 usunięte na czerwono, 🟡 zmienione na żółto. Do sporów i dokumentacji.</p></div>'+
        '<div class="row"><span class="e">🎵</span><p><b>Inline wyszukiwanie utworu</b> — w dowolnym czacie wpisz <code>@nazwa_bota tytuł</code> i wyślij utwór prosto do rozmowy.</p></div>'+
        '<h3>Organizacja archiwum (wymaga Threaded Mode)</h3>'+
        '<div class="row"><span class="e">🗂</span><p><b>Wątek na kontakt</b> — każdy rozmówca dostaje swój temat w czacie z botem z przypiętą kartą; trafiają tam jego usunięcia, zmiany i zdjęcia jednorazowe.</p></div>'+

        '<div class="row"><span class="e">🗓</span><p>Raz dziennie — podsumowanie: usunięcia, zmiany, nowe kontakty.</p></div>'+
        '<h3>Za darmo i w subskrypcji</h3>'+

        '<div class="row"><span class="e">⭐</span><p><b>W subskrypcji</b> — archiwizacja: przechwytywanie usuniętych, zmienionych i jednorazowych zdjęć, wątki kontaktów, szukanie, eksport, podsumowanie. Pierwsze 3 dni gratis.</p></div>',
      agr_html:'<p>Rozpoczynając i kontynuując korzystanie z bota, akceptujesz warunki.</p>'+
        '<h3>1. Cel</h3><p>Prywatne archiwum Twoich czatów biznesowych: zapisywanie wiadomości, dostępnych mediów i metadanych, powiadomienia o zmianach i usunięciach. Wymagane są Telegram Premium i połączenie bota.</p>'+
        '<h3>2. Dane</h3><p>Bot przechowuje treść i metadane Twoich czatów, aby je pokazywać. Możesz poprosić administratora o usunięcie danych.</p>'+
        '<h3>3. Twoja odpowiedzialność</h3><p>Korzystasz z bota wyłącznie zgodnie z prawem i musisz przestrzegać przepisów o tajemnicy komunikacji i ochronie danych osobowych. Potwierdzasz prawo do archiwizacji własnych rozmów i ponosisz pełną odpowiedzialność.</p>'+
        '<h3>4. Ograniczenia</h3><p>Usługa „tak jak jest", bez gwarancji; część funkcji zależy od ograniczeń Telegrama.</p>'+
        '<h3>5. Płatność</h3><p>Subskrypcja opłacana przez Telegram Stars (⭐).</p>'+
        '<h3>6. Zmiany</h3><p>Warunki mogą się zmieniać; dalsze korzystanie = akceptacja. Jeśli się nie zgadzasz, przestań korzystać.</p>'+
        '<h3>7. Pobieranie</h3><p>Narzędzia pobierania (wideo, muzyka, cały utwór) pobierają treści ze źródeł zewnętrznych. Odpowiedzialność za pobieranie i korzystanie z takich treści, w tym prawa autorskie, ponosi wyłącznie użytkownik.</p>' }
  };

  var LANG = "ru";
  function pickLang() {
    var saved = null; try { saved = localStorage.getItem('eug_lang'); } catch(e){}
    if (saved && I18N[saved]) return saved;
    var tl = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "";
    tl = tl.slice(0,2);
    if (tl === 'uk') return 'uk'; if (tl === 'pl') return 'pl'; if (tl === 'en') return 'en';
    return 'ru';
  }
  function T(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.ru[k] || k; }
  function setLang(code){
    LANG = I18N[code] ? code : 'ru';
    try { localStorage.setItem('eug_lang', LANG); } catch(e){}
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = T(el.getAttribute('data-i18n')); });
    var ci=document.getElementById('caps-inline'); if(ci) ci.innerHTML=T('caps_html');
    document.querySelectorAll('.langbar button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-lang')===LANG); });
    document.documentElement.lang = LANG;
  }
  document.querySelectorAll('.langbar button').forEach(function(b){ b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); }); });

  document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active'); document.getElementById('panel-'+t.getAttribute('data-tab')).classList.add('active');
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch(e){} } window.scrollTo(0,0);
  }); });

  if (api) { fetch(API_BASE+'/api/prices').then(function(r){return r.json();}).then(function(d){ if(d&&d.ok){ for(var k in d.prices){ var el=document.querySelector('.buy[data-plan="'+k+'"]'); if(el) el.textContent=d.prices[k]+' ⭐'; } } }).catch(function(){}); }

  document.querySelectorAll('.buy').forEach(function(b){ b.addEventListener('click', function(){ buyPlan(b.getAttribute('data-plan')); }); });
  function pay(link){ if(!(tg&&tg.openInvoice)) return; tg.openInvoice(link, function(st){ if(st==='paid'){ PROMO="";GIFT=""; tg.showPopup?tg.showPopup({title:'OK',message:T('paid')}):alert(T('paid')); } else if(st==='failed'){ if(tg.showAlert) tg.showAlert(T('payfail')); } }); }
  function payStatic(plan){ var l=INVOICES[plan]; if(tg&&tg.openInvoice&&l) pay(l); else openBot('buy_'+plan); }
  function buyPlan(plan){ if(api){ var u=API_BASE+'/api/invoice?initData='+encodeURIComponent(INITDATA)+'&plan='+plan+(PROMO?'&promo='+encodeURIComponent(PROMO):'')+(GIFT?'&gift='+encodeURIComponent(GIFT):''); fetch(u).then(function(r){return r.json();}).then(function(d){ if(d&&d.ok&&d.link) pay(d.link); else payStatic(plan); }).catch(function(){ payStatic(plan); }); } else payStatic(plan); }

  var modal=document.getElementById('modal'), mbody=document.getElementById('mbody');
  function openModal(html){ mbody.innerHTML=html; modal.classList.add('open'); if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.impactOccurred('light');}catch(e){}} }
  function closeModal(){ modal.classList.remove('open'); }
  document.getElementById('mclose').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if(e.target===modal) closeModal(); });

  function capsHtml(){ return '<h2>'+T('b_caps')+'</h2>'+T('caps_html'); }
  function agrHtml(){ return '<h2>'+T('b_agreement')+'</h2>'+T('agr_html'); }
  document.querySelectorAll('[data-modal]').forEach(function(b){ b.addEventListener('click', function(){ var k=b.getAttribute('data-modal'); openModal(k==='caps'?capsHtml():agrHtml()); }); });

  var inv=document.getElementById('btn-invite');
  if(inv) inv.addEventListener('click', function(){
    var uid=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)?tg.initDataUnsafe.user.id:null;
    var link=uid?('https://t.me/'+BOT+'?start=ref_'+uid):('https://t.me/'+BOT);
    openModal('<h2>'+T('invite_h')+'</h2><p>'+T('invite_p')+'</p><div class="linkbox">'+link+'</div><div class="act"><button id="copybtn">'+T('copy')+'</button><button id="sharebtn">'+T('share')+'</button></div>');
    document.getElementById('copybtn').addEventListener('click', function(){ var s=this; try{ navigator.clipboard.writeText(link).then(function(){ s.textContent=T('copied'); }); }catch(e){ if(tg&&tg.showAlert) tg.showAlert(link); } });
    document.getElementById('sharebtn').addEventListener('click', function(){ var sh='https://t.me/share/url?url='+encodeURIComponent(link); if(tg&&tg.openTelegramLink) tg.openTelegramLink(sh); else window.open(sh,'_blank'); });
  });

  function showStatus(){ openModal('<h2>'+T('status_h')+'</h2><p>'+T('status_load')+'</p>');
    fetch(API_BASE+'/api/status?initData='+encodeURIComponent(INITDATA)).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok){ mbody.innerHTML='<h2>'+T('status_h')+'</h2><p>'+T('status_err')+'</p>'; return; }
      var body = d.owner ? T('status_owner') : (T('status_until')+' <b>'+d.date+'</b><br>'+T('status_days')+' <b>'+d.days+'</b>');
      mbody.innerHTML='<h2>'+T('status_h')+'</h2><p>'+body+'</p>';
    }).catch(function(){ mbody.innerHTML='<h2>'+T('status_h')+'</h2><p>'+T('status_err')+'</p>'; });
  }
  function promoModal(){ openModal('<h2>'+T('promo_h')+'</h2><input id="promoin" class="inp" placeholder="'+T('promo_in')+'"><div class="act"><button id="promook">'+T('promo_apply')+'</button></div><p id="promores"></p>');
    document.getElementById('promook').addEventListener('click', function(){ var code=document.getElementById('promoin').value.trim(); if(!code) return;
      fetch(API_BASE+'/api/promo/check?initData='+encodeURIComponent(INITDATA)+'&code='+encodeURIComponent(code)).then(function(r){return r.json();}).then(function(d){
        if(d&&d.ok){ PROMO=code; document.getElementById('promores').innerHTML=T('promo_ok')+' '+d.discount+T('promo_pick'); } else document.getElementById('promores').innerHTML=T('promo_bad');
      }).catch(function(){ document.getElementById('promores').innerHTML=T('status_err'); }); });
  }
  function giftModal(){ openModal('<h2>'+T('gift_h')+'</h2><p>'+T('gift_p')+'</p><input id="giftin" class="inp" inputmode="numeric" placeholder="123456789"><div class="act"><button id="giftok">'+T('gift_save')+'</button></div><p id="giftres"></p>');
    document.getElementById('giftok').addEventListener('click', function(){ var v=document.getElementById('giftin').value.trim(); if(/^-?\d+$/.test(v)){ GIFT=v; document.getElementById('giftres').innerHTML=T('gift_ok'); setTimeout(closeModal,1500); } else document.getElementById('giftres').innerHTML=T('gift_bad'); });
  }

  document.querySelectorAll('[data-link]').forEach(function(b){ b.addEventListener('click', function(){ var k=b.getAttribute('data-link'); if(api){ if(k==='status') return showStatus(); if(k==='promo') return promoModal(); if(k==='gift') return giftModal(); } openBot(k); }); });
  function openBot(p){ var u='https://t.me/'+BOT+'?start='+p; if(tg&&tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u,'_blank'); }

  // ===== Калькулятор и дневник калорий (всё локально, без сервера) =====
  function dayKey(d){ return 'eug_cal_'+d.getFullYear()+'_'+(d.getMonth()+1)+'_'+d.getDate(); }
  function calKey(){ return dayKey(new Date()); }
  function calGet(k,def){ try{ var v=localStorage.getItem(k); return v===null?def:+v; }catch(e){ return def; } }
  function calSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  // График по дням с листанием (неделя/месяц) и тапом по дню.
  var chMode='week', chOffset=0, chSel=-1;
  function fmtD(d){ return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2); }
  function chartDays(){
    var n = chMode==='week'?7:30;
    var end=new Date(); end.setHours(0,0,0,0); end.setDate(end.getDate()-chOffset*n);
    var arr=[]; for(var i=n-1;i>=0;i--){ var d=new Date(end); d.setDate(end.getDate()-i); arr.push(d); } return arr;
  }
  function renderChart(){
    var box=document.getElementById('chSvg'); if(!box) return;
    var days=chartDays(), target=calGet('eug_cal_target',0), n=days.length;
    var vals=days.map(function(d){return calGet(dayKey(d),0);});
    var maxv=Math.max(target||0, Math.max.apply(null,vals), 1), scaleMax=maxv*1.14;
    var W=Math.max(320, n*(n>7?12:40)), H=190, padL=18, padR=18, padTop=22, padBot=28;
    var plotBot=H-padBot, plotH=plotBot-padTop, bw=(W-padL-padR)/n;
    function yOf(v){ return plotBot - plotH*(v/scaleMax); }
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
    if(target){
      var ty=yOf(target);
      s+='<line x1="'+padL+'" y1="'+ty+'" x2="'+(W-padR)+'" y2="'+ty+'" stroke="#ffcf3a" stroke-dasharray="4 3" stroke-width="1"/>';
      s+='<text x="'+(W-padR)+'" y="'+(ty-3)+'" text-anchor="end" font-size="8" fill="#ffcf3a">'+T('chart_norm')+' '+target+'</text>';
    }
    days.forEach(function(d,i){
      var v=vals[i], x=padL+i*bw, bx=x+bw*0.18, barW=bw*0.64, cx=bx+barW/2, yv=yOf(v);
      if(target && v>target){
        var yt=yOf(target);
        s+='<rect x="'+bx+'" y="'+yt+'" width="'+barW+'" height="'+(plotBot-yt)+'" rx="2" fill="var(--neon)"/>';
        s+='<rect x="'+bx+'" y="'+yv+'" width="'+barW+'" height="'+(yt-yv)+'" rx="2" fill="#ff4d5e"/>';
      } else {
        s+='<rect x="'+bx+'" y="'+yv+'" width="'+barW+'" height="'+(plotBot-yv)+'" rx="2" fill="var(--neon)"/>';
      }
      if(i===chSel){
        s+='<rect x="'+(bx-1.5)+'" y="'+(yv-1.5)+'" width="'+(barW+3)+'" height="'+(plotBot-yv+3)+'" rx="3" fill="none" stroke="#fff" stroke-width="1"/>';
        if(v>0) s+='<text x="'+cx+'" y="'+(yv-4)+'" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">'+v+'</text>';
      }
      if(n<=7 || i%5===0 || i===n-1){
        var lab = chMode==='week' ? fmtD(d) : String(d.getDate());
        s+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="8" fill="#9fb0cf">'+lab+'</text>';
      }
      s+='<rect x="'+x+'" y="'+padTop+'" width="'+bw+'" height="'+(plotBot-padTop)+'" fill="transparent" data-i="'+i+'" data-date="'+fmtD(d)+'" data-val="'+v+'" style="cursor:pointer"/>';
    });
    s+='</svg>';
    box.innerHTML=s;
    var rng=document.getElementById('chRange'); if(rng) rng.textContent=fmtD(days[0])+' – '+fmtD(days[n-1]);
  }
  var CAL_FIELDS=['cxSex','cxAge','cxH','cxW','cxAct','cxGoal'];
  function calSaveProfile(){ try{ var o={}; CAL_FIELDS.forEach(function(id){ var el=document.getElementById(id); if(el) o[id]=el.value; }); localStorage.setItem('eug_cal_profile', JSON.stringify(o)); }catch(e){} }
  function calLoadProfile(){ try{ var o=JSON.parse(localStorage.getItem('eug_cal_profile')||'null'); if(!o) return; CAL_FIELDS.forEach(function(id){ var el=document.getElementById(id); if(el&&o[id]!=null&&o[id]!=='') el.value=o[id]; }); }catch(e){} }
  function calcNorm(){
    var age=+document.getElementById('cxAge').value, h=+document.getElementById('cxH').value, w=+document.getElementById('cxW').value;
    if(!age||!h||!w){ return; }
    var sex=document.getElementById('cxSex').value;
    var bmr=10*w+6.25*h-5*age+(sex==='m'?5:-161);
    var tdee=bmr*(+document.getElementById('cxAct').value);
    var g=document.getElementById('cxGoal').value;
    var target=Math.round(tdee+(g==='lose'?-500:(g==='gain'?400:0)));
    calSet('eug_cal_target', target);
    calSaveProfile();
    document.getElementById('cxRes').innerHTML='<b>'+T('cal_norm')+': '+target+' '+T('cal_kcal')+'</b>';
    renderCal();
  }
  function renderCal(){
    var eaten=calGet(calKey(),0), target=calGet('eug_cal_target',0);
    var el=document.getElementById('cxStat'); if(!el) return;
    var s=T('cal_eaten')+': <b>'+eaten+'</b> '+T('cal_u');
    if(target) s+='<br>'+T('cal_left')+': <b>'+Math.max(0,target-eaten)+'</b> '+T('cal_u');
    el.innerHTML=s;
    renderChart();
  }
  (function(){
    calLoadProfile();  // восстанавливаем сохранённые пол/возраст/рост/вес/активность/цель
    CAL_FIELDS.forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener('change', calSaveProfile); });
    var b=document.getElementById('cxCalc'); if(b) b.onclick=calcNorm;
    var a=document.getElementById('cxAdd'); if(a) a.onclick=function(){ var v=+document.getElementById('cxIn').value; if(v){ calSet(calKey(), calGet(calKey(),0)+v); document.getElementById('cxIn').value=''; renderCal(); } };
    var r=document.getElementById('cxReset'); if(r) r.onclick=function(){ calSet(calKey(),0); renderCal(); };
    var t=calGet('eug_cal_target',0); if(t) document.getElementById('cxRes').innerHTML='<b>'+T('cal_norm')+': '+t+' '+T('cal_kcal')+'</b>';
    var co=document.getElementById('crmOn'); if(co) co.onclick=function(){ openBot('cal_on'); };
    var cf=document.getElementById('crmOff'); if(cf) cf.onclick=function(){ openBot('cal_off'); };
    // График: переключатели недели/месяца, листание и тап по дню.
    var bw=document.getElementById('chW'); if(bw) bw.onclick=function(){ chMode='week'; chOffset=0; chSel=-1; renderChart(); };
    var bm=document.getElementById('chM'); if(bm) bm.onclick=function(){ chMode='month'; chOffset=0; chSel=-1; renderChart(); };
    var bp=document.getElementById('chPrev'); if(bp) bp.onclick=function(){ chOffset++; chSel=-1; renderChart(); };
    var bn=document.getElementById('chNext'); if(bn) bn.onclick=function(){ if(chOffset>0){ chOffset--; chSel=-1; renderChart(); } };
    var sv=document.getElementById('chSvg'); if(sv) sv.addEventListener('click', function(e){
      var r=e.target.closest('[data-i]'); if(!r) return;
      chSel=+r.getAttribute('data-i');
      document.getElementById('chSel').innerHTML='<b>'+r.getAttribute('data-date')+'</b>: '+r.getAttribute('data-val')+' '+T('cal_u');
      renderChart();
    });
    renderCal();
  })();

  // Вода: настройка открывает бота deep-link'ом (работает без сервера/туннеля).
  (function(){
    function hhmm(v){ return (v||'').replace(':',''); }
    var on=document.getElementById('wtrOn');
    if(on) on.onclick=function(){
      var ml=+document.getElementById('wtrMl').value;
      var f=hhmm(document.getElementById('wtrFrom').value), t=hhmm(document.getElementById('wtrTo').value);
      if(ml>=200 && f.length===4 && t.length===4) openBot('water_'+ml+'_'+f+'_'+t);
    };
    var off=document.getElementById('wtrOff');
    if(off) off.onclick=function(){ openBot('water_off'); };
  })();

  LANG = pickLang(); setLang(LANG);
</script>
